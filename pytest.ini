[pytest]
testpaths = tests
python_files = test_*.py
addopts = --strict-markers

markers =
    behawioralny: testy wymagające uruchomionego modelu (Ollama). Nie są podstawą gwarancji bezpieczeństwa — uruchamiane osobno: pytest -m behawioralny
    izolacja: bramki izolacji (I-1…I-9). Wymagają Dockera dla części testów.
    # Marker `wolny` USUNIĘTY 16.08.2026. Był zadeklarowany od początku
    # i nienadany ani jednemu testowi, więc `-m wolny` zbierał zero
    # testów, a `-m "not wolny"` nic nie wykluczał. Pomiar czasów
    # (`--durations`) pokazał, że wszystkie testy trwające ponad sekundę
    # są już oznaczone jako `behawioralny` — czyli ten marker nie miał
    # i nie ma kandydatów. Zadeklarowany, a nienadany marker myli:
    # sugeruje istnienie podziału, którego nie ma.
    konfiguracja: bramka konfiguracji serwera modelu. Dotyczy MASZYNY, na której działa Ollama — na maszynie budującej wypada ją odznaczyć: pytest -m "not konfiguracja"
    jakosc: bramka jakosci — progi J-3 i J-4 wobec ostatniego raportu benchmarku. Nie uruchamia benchmarku; czyta wynik. Pominiecie: pytest -m "not jakosc"
