[build-system]
# setuptools>=77 jest wymagane przez `license = "MIT"` w postaci SPDX
# (PEP 639). Starsze wersje przyjmowały wyłącznie tabelę `{ file = ... }`,
# którą PEP 639 uznaje za przestarzałą.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kancelaria-lex"
# ⚠️ WERSJA MA ZGADZAĆ SIĘ Z CHANGELOG.md. Do 17.08.2026 stało tu 0.1.0,
# podczas gdy dziennik zmian ogłaszał [1.0.0] jako pierwsze wydanie
# publiczne. Przy publikacji na PyPI to nie jest kosmetyka: numer wersji
# jest niezmienny po wgraniu, a rozjazd z dziennikiem zmian sprawia, że
# nie da się powiedzieć, co właściwie zostało wydane.
version = "1.0.0"
description = "Lokalny system agentowy do analizy akt dla kancelarii prawnej — w pełni offline, cytat po numerze zdania"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["prawo", "kancelaria", "rag", "lokalny-llm", "ollama", "legal-tech", "offline"]

# AUTORSTWO. Jedna osoba — projekt, kod, aparat pomiarowy i dokumentacja
# zgodności; szczegóły w AUTHORS.md. Podany jest sam `name`, bez `email`:
# metadanych PyPI nie da się zmienić po wgraniu wersji, a adres e-mail w polu
# `authors` trafia do publicznych metadanych paczki na stałe. Sam `name` jest
# poprawny wg PEP 621 i wystarcza; e-mail można dopisać świadomie przed
# publikacją, jeśli ma tam być.
authors = [{ name = "Krzysztof Augiewicz" }]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Legal Industry",
    "Natural Language :: Polish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Linguistic",
    "Private :: Do Not Upload",
]

# ⚠️ `Private :: Do Not Upload` JEST TU CELOWO I BLOKUJE WYSYŁKĘ NA PyPI.
#
# PyPI odrzuca każdą paczkę z tym klasyfikatorem. Blokada stoi, dopóki nie
# rozstrzygnie się kolizja nazwy modułu opisana niżej przy `packages`:
# wgranie paczki instalującej moduł najwyższego poziomu `panel` zepsułoby
# środowiska tysiącom użytkowników biblioteki HoloViz Panel, a wersji raz
# wgranej na PyPI nie da się podmienić — tylko wycofać, już po szkodzie.
#
# Usunąć dopiero razem ze zmianą nazwy modułu i uzupełnieniem autorów.

[project.urls]
Homepage = "https://github.com/AI4CharityPL/kancelaria-lex"
Repository = "https://github.com/AI4CharityPL/kancelaria-lex"
Issues = "https://github.com/AI4CharityPL/kancelaria-lex/issues"
Changelog = "https://github.com/AI4CharityPL/kancelaria-lex/blob/main/CHANGELOG.md"
"Setup guide" = "https://github.com/AI4CharityPL/kancelaria-lex/blob/main/QUICKSTART.md"

# ══════════════════════════════════════════════════════════════════════
#  ZERO ZALEŻNOŚCI RUNTIME — TO JEST WYMAGANIE, NIE NIEDOPATRZENIE.
#
#  Każdy pakiet w łańcuchu dostaw to pakiet, którego trzeba pilnować
#  (art. 21 ust. 2 lit. d ustawy o KSC). Panel korzysta wyłącznie
#  z biblioteki standardowej:
#
#    http.server      serwer panelu
#    sqlite3          baza spraw
#    hashlib.scrypt   hasła profili
#    secrets          tokeny sesji
#    http.cookies     ciasteczko sesji
#    urllib.request   jedyne połączenie: lokalna Ollama
#
#  BM25, tokenizacja i rozpoznawanie języka są napisane od zera
#  z tego samego powodu.
#
#  Dopisanie tu czegokolwiek wymaga świadomej decyzji i wpisu
#  w docs/14-decyzje/. Bramka I-1 pilnuje, żeby nie wróciły SDK
#  dostawców chmurowych.
# ══════════════════════════════════════════════════════════════════════
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kancelaria-lex = "panel.serwer:main"

[tool.setuptools]
# Instalacja edytowalna (pip install -e .) jest wariantem docelowym:
# panel czyta Modelfile'e, korpusy i src/aplikacje/ ścieżkami względem
# katalogu repozytorium, więc pliki mają zostać tam, gdzie są.
#
# ══════════════════════════════════════════════════════════════════════
#  ⚠️ NAZWA `panel` BLOKUJE PUBLIKACJĘ NA PyPI. ROZPOZNANE 17.08.2026.
#
#  `panel` na PyPI to HoloViz Panel — framework do aplikacji danych,
#  sponsorowany m.in. przez Anacondę i NumFOCUS, wersja 1.9.3.
#  Ta paczka instalowałaby moduł najwyższego poziomu o tej samej nazwie,
#  więc w każdym środowisku, gdzie stoją obie, `import panel` trafiałby
#  w zależności od kolejności na sys.path. Awaria byłaby cicha i zdarzałaby
#  się u kogoś obcego, kto o naszym projekcie nie wie nic.
#
#  Do publikacji paczki trzeba dodatkowo rozstrzygnąć drugą rzecz:
#  moduły w `panel/` importują się nawzajem płasko (`import baza`),
#  co działa dzięki `sys.path.insert` przy starcie. Po instalacji z koła
#  ścieżka `KORZEN.parent / "src" / "aplikacje"` nie istnieje — tego
#  katalogu w paczce nie ma.
#
#  Uruchomienie z klonu repozytorium (tak opisuje to QUICKSTART.md)
#  działa poprawnie i nie jest tym objęte. Blokada dotyczy wyłącznie
#  drogi przez `pip install kancelaria-lex`.
# ══════════════════════════════════════════════════════════════════════
packages = ["panel"]

[tool.setuptools.package-data]
panel = ["statyczne/*.html", "statyczne/*.css", "statyczne/*.js"]
